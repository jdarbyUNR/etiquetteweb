<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etiquette</title>
  <meta
    name="description"
    content="Etiquette is a Reno-based art rock band. Pre-save Scratching at the Walls, listen to Too Close, and watch the band perform live."
  >
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <main class="landing">
      <section class="section section-hero">
        <figure class="hero-image">
          <img src="web-images/hero.jpg" alt="Etiquette performing live for a crowd" fetchpriority="high">
        </figure>

        <div class="top-intro">
          <h1>Etiquette</h1>
          <p class="lede">RENO<br>ART ROCK<br>POST-PUNK</p>
        </div>

        <div class="icon-links" aria-label="Music and social links">
          <a class="icon-link" href="https://open.spotify.com/artist/5dfJ7QybNDCsBmghTZ3dxk?si=y98oIVoWSI6gOUL7gA9QYQ" target="_blank" rel="noreferrer" aria-label="Etiquette on Spotify">
            <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
              <circle cx="12" cy="12" r="12" fill="currentColor"></circle>
              <path d="M6 9.2c4-1.2 8.3-.9 12 1" fill="none" stroke="#050505" stroke-width="1.9" stroke-linecap="round"></path>
              <path d="M7.1 12.2c3.1-.8 6.3-.5 9 .8" fill="none" stroke="#050505" stroke-width="1.8" stroke-linecap="round"></path>
              <path d="M8.2 15c2.2-.5 4.2-.3 6 .5" fill="none" stroke="#050505" stroke-width="1.7" stroke-linecap="round"></path>
            </svg>
          </a>
          <a class="icon-link" href="https://music.apple.com/us/artist/etiquette/1818498648" target="_blank" rel="noreferrer" aria-label="Etiquette on Apple Music">
            <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
              <path d="M16.6 12.6V5.7l-6.2 1.2v9.1a2.6 2.6 0 1 1-1.4-2.3V7.9l9-1.7v7.6a2.6 2.6 0 1 1-1.4-1.2z" fill="currentColor"></path>
            </svg>
          </a>
          <a class="icon-link" href="https://etiquettereno.bandcamp.com/album/what-a-day" target="_blank" rel="noreferrer" aria-label="Etiquette on Bandcamp">
            <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
              <path d="M6 18 11 6h7l-5 12z" fill="currentColor"></path>
            </svg>
          </a>
          <a class="icon-link" href="https://soundcloud.com/etiquettereno" target="_blank" rel="noreferrer" aria-label="Etiquette on SoundCloud">
            <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
              <path d="M8.2 17.5h9.3a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6-1.6A2.9 2.9 0 0 0 8.2 17.5Z" fill="currentColor"></path>
              <rect x="4.2" y="10.5" width="1.2" height="7" fill="currentColor"></rect>
              <rect x="6" y="9.5" width="1.2" height="8" fill="currentColor"></rect>
            </svg>
          </a>
          <a class="icon-link" href="https://www.youtube.com/@EtiquetteBand" target="_blank" rel="noreferrer" aria-label="Etiquette on YouTube">
            <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
              <path d="M21 12c0 3.5-.4 5.4-1 6.1-.6.6-1.8.9-8 .9s-7.4-.3-8-.9C3.4 17.4 3 15.5 3 12s.4-5.4 1-6.1C4.6 5.3 5.8 5 12 5s7.4.3 8 .9c.6.7 1 2.6 1 6.1Z" fill="currentColor"></path>
              <path d="m10 8.7 5.2 3.3L10 15.3Z" fill="#050505"></path>
            </svg>
          </a>
          <a class="icon-link" href="https://www.instagram.com/etiquettereno/" target="_blank" rel="noreferrer" aria-label="Etiquette on Instagram">
            <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
              <rect x="4.5" y="4.5" width="15" height="15" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"></rect>
              <circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
              <circle cx="16.8" cy="7.3" r="1.1" fill="currentColor"></circle>
            </svg>
          </a>
        </div>
      </section>

      <section class="section section-player">
        <div class="release-card">
          <figure class="release-art">
            <img src="web-images/scratching-at-the-walls.jpg" alt="Artwork for Scratching at the Walls by Etiquette">
          </figure>
          <div class="release-copy">
            <h2>Scratching at the Walls</h2>
            <p>New single from Etiquette.</p>
            <a class="cta-button" href="https://distrokid.com/hyperfollow/etiquette2/scratching-at-the-walls?ref=release" target="_blank" rel="noreferrer">Pre-save now</a>
          </div>
        </div>
        <div class="player-stack">
          <div class="player-copy">
            <p class="eyebrow">Featured Track</p>
            <p>"Too Close"</p>
          </div>
          <div class="track-player">
            <iframe
              style="border-radius:12px"
              src="https://open.spotify.com/embed/track/1t7bGFDFLxrtzlh3OKrYVx?utm_source=generator"
              width="100%"
              height="152"
              frameborder="0"
              allowfullscreen=""
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy"
              title="Etiquette featured track on Spotify"
            ></iframe>
          </div>
        </div>
      </section>

      <section class="section section-video">
        <div class="video-heading">
          <p class="eyebrow">Live</p>
          <h2>Live Set</h2>
        </div>
        <div class="video-frame">
          <iframe
            src="https://www.youtube-nocookie.com/embed/AyHA30AxHL8"
            title="Etiquette live performance"
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>
        </div>
      </section>

      <section class="section section-photo-row">
        <div class="filmstrip-grid">
          <figure class="filmstrip-card">
            <img src="web-images/live-1.jpg" alt="Etiquette performing live" loading="lazy">
          </figure>
          <figure class="filmstrip-card">
            <img src="web-images/live-2.jpg" alt="Etiquette bassist performing live" loading="lazy">
          </figure>
          <figure class="filmstrip-card">
            <img src="web-images/live-3.jpg" alt="Etiquette guitarist during a live set" loading="lazy">
          </figure>
          <figure class="filmstrip-card">
            <img src="web-images/live-4.jpg" alt="Etiquette performing live" loading="lazy">
          </figure>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
